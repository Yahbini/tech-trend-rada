spring:
  application:
    name: telegram-bot-service
  config:
    import: optional:file:../../infra/docker/.env[.properties]

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:tech_trend_radar}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}
        specific.avro.reader: true # đổ kết quả vào class NewTechDetected của common-lib, không dùng GenericRecord.
    listener:
      ack-mode: manual-immediate

app:
  kafka:
    topics:
      new-tech-alerts: new-tech-alerts
    groups:
      alert: telegram-bot-group
  telegram:
    base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
    connect-timeout: 5s
    read-timeout: 10s
    retry:
      max-retries: 3
      delay: 1s
      multiplier: 2
      timeout: 2m
      max-retry-after: 60s