spring:
  application:
    name: stream-processing-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    streams:
      application-id: tech-trend-stream-processing
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:18081}
      state-dir: ${KAFKA_STREAMS_STATE_DIR:/var/lib/techtrend/kafka-streams}

app:
  kafka:
    topics:
      tech-updates: tech-updates
      tech-mentions: tech-mentions
      new-tech-alerts: new-tech-alerts
      tech-trend-aggregated: tech-trend-aggregated
  detection:
    new-tech-window: 24h
  aggregation:
    window-size: 1h
    grace: 10m