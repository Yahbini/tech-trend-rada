server:
  port: 18082

spring:
  application:
    name: api-gateway-service
  config:
    import: optional:file:../../infra/docker/.env[.properties]

  elasticsearch:
    uris: ${ES_URIS:http://localhost:19200}
    connection-timeout: 1s
    socket-timeout: 30s

  grpc:
    client:
      channel:
        scoring:
          target: ${SCORING_GRPC_TARGET:localhost:9090}


logging:
  level:
    com.techtrend.apigateway.service: DEBUG

app:
  elasticsearch:
    index: tech-trend-aggregated

